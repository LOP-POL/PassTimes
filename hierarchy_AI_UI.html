<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchy Manager</title>
    <link rel="stylesheet" href="heirarchy_AI_UI.css">
    <link rel="shortcut icon" href="/favicon_io/favicon.ico" type="image/x-icon">
</head>

<body>
    <main>

        <div class="inputsForm" id="form">
            <!-- Levels Controls -->

            <div class="levelsControls">
                <button class="levelUp">
                    Level Up
                </button>

                <button class="rename">
                    Rename
                </button>

                <button class="levelDown">
                    Level Down
                </button>
            </div>

            <!-- Inputs Left -->
            <div class="inputsLeft">
                <div>
                    <button class="parentLeft">
                        ← Switch Parent Left
                    </button>
                </div>

                <div>
                    <button class="addChild">
                        Add Child +
                    </button>
                </div>


            </div>

            <!-- Inputs Middle -->
            <div class="inputsMiddle">
                <div class="parentDiv">
                    <label for="Name">
                        Parent
                        <input type="text" id="Name" placeholder="Name">
                    </label>
                </div>

                <div class="childDiv">
                    <label for="Child">
                        Child
                        <input type="text" id="Child" placeholder="Child">
                    </label>
                </div>
            </div>

            <!-- Inputs Right -->
            <div class="inputsRight">
                <button class="parentRight">
                    Switch Parent Right →
                </button>

                <div>
                    <button class="removeChild">
                        Remove parent
                    </button>
                </div>

            </div>

            <!-- Container -->
            <div id="canvas">
                <div id="container">
                    <!-- Dynamic content will be added here by JS -->
                </div>
            </div>

            <div id="export">
                <button id="exportBtn">
                    export json
                </button>
                <label for="importBtn
                ">IMPORT</label>
                <input type="file" id="importBtn">
                <hr
                    style="width: 100%; height: 1px; stroke-width: 2px; font-weight:bold; background-color: black; margin: 5px;" />
                <button id="clearBtn">
                    Clear
                </button>

                <button id="reset">
                    reset zoom
                </button>
            </div>
            <div id="colorControls">
                <div class="colorLevel">
                    <p>Select Level Then Choose a color </p>
                    <div class="colorLevel">
                     <input  type="color" id="colorInput" name="colorInput">
                    </div>
                </div> 
            </div>
        </div>

        <div id="miniLogs">

        </div>

    </main>

    <script type="module" src="./heirarchy.js"></script>
    <script src="heirarchy_canvas.js"></script>
    <script type="module" src="./heirarchy_colors.js"></script>
</body>

</html>
